version: '3'

services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env ## Change this file for customized env variables
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    # Upstream default is '127.0.0.1:3000:3000'. Remapped to 3001 on the
    # host only (container port is still 3000) — DIRUS's own apps/api
    # already owns localhost:3000 (see root README.md / .env PORT), and
    # this compose is otherwise the official file, untouched, per
    # docs/ARCHITECTURE.md §10 ("Chatwoot lo exige: su Docker Compose
    # oficial, intocado").
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Upstream ships this hardcoded empty, with a comment telling the
      # deployer to edit it in place per deployment. Using variable
      # substitution instead (docker compose reads .env in this directory
      # for this automatically) keeps .env as the single source of truth —
      # rails/sidekiq already read the same POSTGRES_PASSWORD from .env via
      # their own env_file:, so this just makes postgres agree with them.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
